name: Memory check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  memcheck:
    name: ASan unit tests + Valgrind server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential valgrind curl python3

      - name: ASan unit tests
        run: |
          chmod +x scripts/memcheck.sh test.sh
          ./scripts/memcheck.sh unit

      - name: Build webserv
        run: make

      - name: Valgrind live server traffic
        run: ./scripts/memcheck.sh valgrind
