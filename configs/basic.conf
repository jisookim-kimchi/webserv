
#Server 1: Main HTTP Server on Port 8080
server
{
    listen              8080;
    host                127.0.0.1;
    server_name         localhost;
    client_max_body_size 10M;

    # Custom Error Pages
    error_page 404 /errors/404.html;
    error_page 500 502 503 504 /errors/50x.html;

    # 1. Root Route
    location /
    {
        root            /home/jisookim/42webserv/www;
        index           index.html index.htm;
        allow_methods   GET POST;
        autoindex       on;
    }

    # 2. Upload & Delete Route
    location /upload
    {
        root            /home/jisookim/42webserv/www/upload;
        allow_methods   GET POST DELETE;
        autoindex       off;
    }

    # 3. HTTP Redirection Route
    location /redirect
    {
        return 301      https://www.google.com;
    }

    # 4. Python CGI Execution Route
    location .py
    {
        allow_methods   GET POST;
        cgi_pass        /usr/bin/python3;
    }

    # 5. PHP CGI Execution Route
    location .php
    {
        allow_methods   GET POST;
        cgi_pass        /usr/bin/php-cgi;
    }
}

# Server 2: Secondary HTTP Server on Port 8081 (Virtual Host Testing)
server
{
    listen              8081;
    host                127.0.0.1;
    server_name         test.local;
    client_max_body_size 1M;

    error_page 404 /errors/404.html;

    location /
    {
        root            /home/jisookim/42webserv/www_test;
        index           index.html;
        allow_methods   GET;
        autoindex       off;
    }
}
