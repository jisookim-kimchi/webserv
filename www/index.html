<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>webserv</title>
  <style>
    body { margin: 2rem; font-family: sans-serif; line-height: 1.5; }
    a { color: #0645ad; }
    code { background: #eee; padding: 0.1em 0.35em; }
  </style>
</head>
<body>
  <h1>webserv</h1>
  <p>Static site root for the 42 HTTP/1.1 server.</p>
  <ul>
    <li><a href="/cgi-bin/hello.py">CGI hello</a></li>
    <li><a href="/cgi-bin/echo.py">CGI echo</a></li>
    <li><a href="/upload/">Upload directory</a> (autoindex)</li>
    <li><a href="/redirect">Redirect</a></li>
  </ul>
  <h2>Upload (POST raw body)</h2>
  <pre><code>curl -X POST --data-binary @file.txt http://127.0.0.1:8080/upload/</code></pre>
  <h2>Delete</h2>
  <pre><code>curl -X DELETE http://127.0.0.1:8080/upload/FILENAME</code></pre>
</body>
</html>
